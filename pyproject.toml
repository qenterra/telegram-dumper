[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-dumper"
version = "0.2.1"
description = "A terminal client for downloading permitted media and files from Telegram chats."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "Telethon>=1.45,<2",
  "keyring>=25,<26",
  "rich>=14,<15",
]

[project.scripts]
telegram-dumper = "telegram_dumper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
